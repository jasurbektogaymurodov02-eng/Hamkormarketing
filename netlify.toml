[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Eski manzillardan yangisiga
[[redirects]]
  from = "/xizmatlar.html"
  to = "/xizmatlar/"
  status = 301
[[redirects]]
  from = "/keyslar.html"
  to = "/keyslar/"
  status = 301
[[redirects]]
  from = "/kontakt.html"
  to = "/kontakt/"
  status = 301
